# Study-Nexus: Autonomous Multi-Agent Personal Study & Creative Research Room on Switch
# Built for WeMakeDevs Flip the Switch Hackathon (Track 02: Best Personal or Creative Workflow)
version: 1

params:
  room_name:
    type: string
    description: Name of your personal study room
    default: "distributed-systems-study"
  provider:
    type: provider
    description: AI agent provider backing your personal study swarm
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: Machine on which the study agents run
    default: local
    input: advanced
  bridge:
    type: bridge
    description: Personal chat app where your study room lives (Discord, Telegram, Mattermost, Slack)
    default: [$first]

agents:
  - name: "nexus-curator"
    description: Academic Source Digest & Research Paper Ingestion Agent
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    instructions: |
      You are @nexus-curator, an academic research and technical content digest specialist.
      When a user shares a link, paper, or topic in this study room:
      1. Extract the core mental models, definitions, invariant theorems, and data structures.
      2. Filter out academic fluff; synthesize a crisp 5-point executive summary.
      3. Tag @nexus-tutor with the key concepts to begin active recall questioning.

  - name: "nexus-tutor"
    description: Socratic Active Recall & Adaptive Practice Quiz Agent
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    instructions: |
      You are @nexus-tutor, a rigorous Socratic study partner.
      Your mission is to prevent passive reading through active recall and spaced repetition:
      1. When @nexus-curator presents a topic, generate 1 targeted conceptual question to test deep understanding.
      2. Evaluate the user's answer: praise strong intuition, correct misconceptions without judgment, and ask a follow-up edge case.
      3. When the user demonstrates mastery, ask if they want to archive the session notes and tag @nexus-scribe.

  - name: "nexus-scribe"
    description: Knowledge Base Formatter & Markdown Note Publisher Agent
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    instructions: |
      You are @nexus-scribe, personal knowledge archivist.
      When @nexus-tutor signals that a concept has been mastered:
      1. Format a publication-grade Markdown study note with:
         • Core Axiom / Definition
         • ASCII / Mermaid Architecture Flow Diagram
         • Q&A Flashcards (Spaced Repetition ready)
         • Pitfalls & Real-World Gotchas
      2. Save the note directly into the user's personal knowledge vault.

room:
  name: "{room_name}"
  description: "Personal study room: Socratic Tutor, Research Curator, and Knowledge Archivist."
  channel_type: channel_private
  bridge: "{bridge}"
  agents: ["nexus-curator", "nexus-tutor", "nexus-scribe"]
  users: ["{$creator}"]
  instructions: |
    Personal AI Study & Research Nexus. Dedicated to active recall, Socratic dialogue,
    and structured knowledge mastery. Share papers, algorithms, or concepts to begin.

kickoff: |
  🎓 @nexus-curator @nexus-tutor @nexus-scribe: Study-Nexus initialized.
  Welcome {$creator}! What topic, algorithm, or paper are we mastering today?
